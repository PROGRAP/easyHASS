name: Validate HACS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate custom integration
        uses: hacs/action@main
        with:
          category: integration
          # This alpha is a custom repository, not a default-catalog submission.
          # Private design screenshots are excluded.
          ignore: images
