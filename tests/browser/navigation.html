<!doctype html>
<html lang="de">
<meta charset="utf-8">
<title>Easy-Hass Browserprüfungen</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:1024px;height:760px;border:1px solid #aaa}li{margin:10px 0}.pass{color:#12633b}.fail{color:#b00020}</style>
<h1>Easy-Hass Browserprüfungen</h1>
<p>Prüft den ausgelieferten Code in einer lokalen HA-Shell-Simulation. Kein Test einer echten HA-Installation.</p>
<p id="summary" role="status">Prüfungen laufen …</p>
<ol id="results"></ol>
<iframe title="HA-Shell-Simulation"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
const results = [];
const wait = () => new Promise(resolve => setTimeout(resolve, 100));
function assert(value, message) { if (!value) throw new Error(message); }
async function test(name, fn) {
  try { await fn(); results.push({name, passed:true}); }
  catch (error) { results.push({name, passed:false, error:error.message}); }
  const result = results.at(-1);
  const item = document.createElement('li');
  item.className = result.passed ? 'pass' : 'fail';
  item.textContent = `${result.passed ? 'PASS' : 'FAIL'}: ${name}${result.error ? ` — ${result.error}` : ''}`;
  document.querySelector('#results').append(item);
}
async function load(path) {
  const loaded = new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
  frame.src = path;
  await loaded;
  await wait();
}
await load('/easy-hass');
const win = frame.contentWindow;
const {panel, drawer, main, sidebar, resolver} = win.easyHassPreview;
const hidden = () => win.getComputedStyle(sidebar).display === 'none';
const styles = () => main.shadowRoot.querySelectorAll('[data-easy-hass-navigation]').length + drawer.shadowRoot.querySelectorAll('[data-easy-hass-navigation]').length;
const route = async (path, event='location-changed') => {
  win.history.pushState(null, '', path);
  win.dispatchEvent(new win.Event(event));
  await wait();
};
const stored = JSON.stringify({...win.localStorage});

await test('Raumoberfläche lädt aus dem ausgelieferten Integrationsordner', () => {
  assert(panel.shadowRoot.querySelector('h1').textContent.includes('Willkommen Zuhause'), 'Überschrift fehlt');
});
await test('Desktop: Seitenleiste ausgeblendet und kein leerer Rand', () => {
  assert(hidden(), 'Seitenleiste sichtbar');
  assert(win.getComputedStyle(drawer.shadowRoot.querySelector('.app-content')).paddingInlineStart === '0px', 'Linker Rand bleibt');
  assert(panel.getBoundingClientRect().x === 0, 'Panel beginnt nicht am linken Rand');
});
await test('HA-Zustand aktualisiert die Verbindungsanzeige', () => {
  panel.hass = {...panel.hass, connected:true};
  assert(panel.shadowRoot.querySelector('#connection-status').textContent.includes('verbunden'), 'Status unverändert');
});
await test('Nicht-Administrator erhält ein zugängliches Expertenziel', () => {
  panel.hass = {...panel.hass, user:{is_admin:false}, panels:{'easy-hass':{component_name:'custom'}, lovelace:{component_name:'lovelace',require_admin:true}, 'mein-zuhause':{component_name:'lovelace'},config:{require_admin:true}}};
  assert(panel.shadowRoot.querySelector('#expert-link').getAttribute('href') === '/mein-zuhause', 'Ungeeignetes Ziel');
  panel.hass = {...panel.hass, user:{is_admin:true}};
});
await test('SPA-Wechsel stellt Navigation wieder her, selbst wenn das Panel im DOM bleibt', async () => {
  await route('/config');
  assert(!hidden() && styles() === 0, 'Navigation bleibt verborgen');
  assert(win.getComputedStyle(drawer.shadowRoot.querySelector('.app-content')).paddingInlineStart === '256px', 'Originaler Rand fehlt');
});
await test('Zurück-Navigation aktiviert die Anpassung erneut', async () => {
  await route('/easy-hass', 'popstate');
  assert(hidden(), 'Navigation nicht verborgen');
});
await test('Notfallparameter lässt die HA-Navigation sichtbar', async () => {
  await route('/easy-hass?easy_hass_navigation=show');
  panel.hass = {...panel.hass};
  assert(!hidden() && styles() === 0, 'Notfallparameter ignoriert');
  await route('/easy-hass');
});
await test('Entfernen und erneutes Einfügen hinterlassen keine Anpassungen', async () => {
  panel.remove();
  assert(!hidden() && styles() === 0, 'Styles nach Disconnect übrig');
  resolver.append(panel);
  await wait();
  assert(hidden() && styles() === 2, 'Wiederverbindung oder doppelte Styles');
});
await test('Unbekannte HA-Struktur fällt auf sichtbare Navigation zurück', async () => {
  drawer.shadowRoot.innerHTML = '<slot></slot><slot name="appContent"></slot>';
  await wait();
  assert(!hidden() && styles() === 0, 'Unbekanntes Layout wurde verändert');
  drawer.render('');
  win.dispatchEvent(new win.Event('location-changed'));
  await wait();
  assert(hidden(), 'Bekanntes Layout nicht wieder erkannt');
});
await test('Mobiles Layout schließt die simulierte Schublade und blockiert erneutes Öffnen', async () => {
  frame.style.width = '390px';
  await wait();
  drawer.open = true;
  win.dispatchEvent(new win.Event('location-changed'));
  await wait();
  assert(hidden() && drawer.open === false, 'Mobile Schublade offen');
  panel.dispatchEvent(new win.CustomEvent('hass-toggle-menu',{bubbles:true,composed:true}));
  assert(drawer.open === false, 'Mobile Schublade wurde erneut geöffnet');
  assert(panel.scrollWidth <= 390, 'Mobiler Inhalt läuft über');
});
await test('Ähnlicher URL-Präfix verändert keine fremde Ansicht', async () => {
  await route('/easy-hass-other');
  assert(!hidden() && styles() === 0, 'Fremde Ansicht verändert');
  await route('/easy-hass');
});
await test('Ignoriertes Schließen der mobilen Schublade lässt HA-Navigation sichtbar', async () => {
  const blockClose = (event) => { if (event.detail?.open === false) event.stopPropagation(); };
  panel.addEventListener('hass-toggle-menu', blockClose);
  drawer.open = true;
  win.dispatchEvent(new win.Event('location-changed'));
  await wait();
  assert(!hidden() && styles() === 0 && drawer.open, 'Offene Schublade wurde versteckt');
  panel.removeEventListener('hass-toggle-menu', blockClose);
  drawer.open = false;
  await route('/config');
  await route('/easy-hass');
});
await test('Keine dauerhaften Browser-Einstellungen verändert', () => {
  assert(JSON.stringify({...win.localStorage}) === stored, 'Browser-Einstellung wurde verändert');
});
await test('Expertenlink funktioniert als unabhängiger Seitenaufruf', async () => {
  frame.style.width = '1024px';
  await wait();
  const loaded = new Promise(resolve => frame.addEventListener('load', resolve, {once:true}));
  panel.shadowRoot.querySelector('#expert-link').click();
  await loaded;
  await wait();
  assert(frame.contentWindow.location.pathname === '/config', 'Expertenziel nicht geöffnet');
  const preview = frame.contentWindow.easyHassPreview;
  assert(frame.contentWindow.getComputedStyle(preview.sidebar).display !== 'none', 'Navigation nach Expertenwechsel verborgen');
});
const failed = results.filter(result => !result.passed).length;
document.querySelector('#summary').textContent = `${results.length - failed}/${results.length} bestanden; ${failed} fehlgeschlagen.`;
document.title = failed ? `FAIL: ${failed} Easy-Hass-Prüfungen` : `PASS: ${results.length} Easy-Hass-Prüfungen`;
window.easyHassTestResults = results;
</script>
</html>
